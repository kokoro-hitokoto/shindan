<!DOCTYPE html>

<style>

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Shippori Mincho','Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif;-webkit-font-smoothing:antialiased}

.view{display:none;flex:1;flex-direction:column}
.view.on{display:flex}
h1{font-size:30px;line-height:1.7;letter-spacing:.06em;margin:50px 0 18px;font-weight:700}

.small{font-size:13px;color:var(--sub);line-height:1.9}
.btn{display:block;width:100%;border:none;border-radius:999px;padding:17px 20px;font:inherit;font-size:16px;letter-spacing:.12em;cursor:pointer;text-align:center;text-decoration:none;transition:opacity .2s}
.btn:active{opacity:.75}
.primary{background:var(--navy);color:var(--cream)}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}

.spacer{flex:1;min-height:30px}

.mode.deep{background:var(--navy);color:var(--cream);border-color:var(--navy)}
.mode b{display:block;font-size:17px;letter-spacing:.1em;margin-bottom:4px}
.mode span{font-size:13px;opacity:.8;line-height:1.8}
.progress{height:3px;background:var(--line);border-radius:3px;margin:30px 0 8px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ac);width:0;transition:width .35s}
.count{font-size:12px;letter-spacing:.2em;color:var(--sub)}
.scene{font-size:20px;line-height:1.8;margin:22px 0 6px;font-weight:700;letter-spacing:.04em}

.opt.picked{background:var(--navy);color:var(--cream);border-color:var(--navy)}
.back{background:none;border:none;font:inherit;color:var(--sub);font-size:13px;letter-spacing:.15em;padding:8px 0;cursor:pointer;align-self:flex-start;margin-top:8px}
body.dark,html.dark{background:var(--navy)}body.dark .wrap>.brand{display:none}#result{color:var(--cream)}
#result .brand{color:#C9C2B3}
.rlabel{font-size:13px;letter-spacing:.3em;color:var(--gold);margin:44px 0 6px}
.rname{font-size:42px;letter-spacing:.12em;margin:0;font-weight:700}.rread{font-size:13px;letter-spacing:.3em;color:#C9C2B3;min-height:1em;margin:2px 0 6px}.ricon{width:76px;height:76px;margin:40px 0 -24px}.ricon svg{width:100%;height:100%}.why p{font-size:15px}
.rsub{font-size:15px;letter-spacing:.12em;color:#C9C2B3;margin:4px 0 0}

.rcatch{font-size:18px;line-height:1.9;margin:16px 0 26px}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(201,169,110,.35);border-radius:16px;padding:18px;margin:0 0 14px}

.combo{border-color:var(--gold);background:rgba(201,169,110,.08)}

</head>
<body>
<div class="wrap">
  <div class="brand"><svg viewBox="0 0 48 48" fill="none"><path d="M10 7h28a6 6 0 0 1 6 6v15a6 6 0 0 1-6 6H22l-8 7v-7h-4a6 6 0 0 1-6-6V13a6 6 0 0 1 6-6z" stroke="#B5775A" stroke-width="2.5" stroke-linejoin="round"/><circle cx="24" cy="20.5" r="4" fill="#B5775A"/></svg>こころにひとこと</div>

  <section class="view on" id="start">
    <h1>こころのタイプ診断</h1>
    <p class="lead">こんなとき、あなたは<br>どんな言葉をかけられたいですか。</p>
    <p class="lead">ほしい言葉には、あなたのこころの形が出ます。<br>月や星にたとえて、あなたのこころを映します。<br>いちばん近いものを、選んでみてください。</p>

    <div class="spacer"></div>
    <button class="mode" onclick="begin('quick')"><b>かんたん診断</b><span>8つの場面・約1分／6つのタイプから、あなたのタイプがわかる</span></button>
    <button class="mode deep" onclick="begin('deep')"><b>くわしい診断</b><span>16の場面・約3分／タイプに加えて「こころの影」までわかる。全36通り</span></button>
  </section>

  <section class="view" id="quiz">
    <div class="progress"><i id="bar"></i></div>
    <div class="count" id="count"></div>
    <div class="scene" id="scene"></div>
    <div class="ask">どんな言葉を、かけられたい？</div>
    <div id="opts"></div>
    <button class="back" id="backBtn" onclick="back()">← ひとつ前へ</button>
  </section>

  <section class="view" id="result">
    <div class="brand"><svg viewBox="0 0 48 48" fill="none"><path d="M10 7h28a6 6 0 0 1 6 6v15a6 6 0 0 1-6 6H22l-8 7v-7h-4a6 6 0 0 1-6-6V13a6 6 0 0 1 6-6z" stroke="#C9A96E" stroke-width="2.5" stroke-linejoin="round"/><circle cx="24" cy="20.5" r="4" fill="#C9A96E"/></svg>こころにひとこと</div>
    <div class="ricon" id="ricon"></div><div class="rlabel">あなたのこころのタイプは</div>
    <div class="rname" id="rname"></div><div class="rread" id="rread"></div>
    <div class="rsub" id="rsub"></div>
    <div class="rcatch" id="rcatch"></div>
    <div class="card why"><h3 id="whyTitle"></h3><p id="rwhy"></p></div>
    <div class="card combo" id="comboCard" style="display:none"><h3 id="comboTitle"></h3><p id="comboText"></p></div>
    <div class="card"><h3>こんなところ、ありませんか</h3><ul id="rtraits"></ul></div>
    <div class="card"><h3>よく言っている口ぐせ</h3><p id="rkuse"></p></div>
    <div class="card"><h3>本当は</h3><p id="rhonne"></p></div>
    <div class="hito" id="rhito"></div>
    <div class="stack">
      <a class="btn gold" id="letterBtn">あなたに宛てた手紙を読む</a>
      <div class="note" id="letterNote"></div>
      <button class="btn primary" id="deepBtn" onclick="begin('deep')" style="background:var(--cream);color:var(--navy)">くわしい診断で「こころの影」も見る</button>
      <button class="btn ghost" onclick="copyShare()">結果をコピーしてシェアする</button>
      <button class="btn ghost" onclick="toggleTypes()">ほかのタイプも見る</button>
      <div class="types" id="types" style="display:none"></div>
      <button class="btn ghost" onclick="restart()">最初にもどる</button>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>

let mode="quick", qs=[], i=0, answers=[], shuffled=[], res=null;
const FROM=(new URLSearchParams(location.search).get("from")||"direct").slice(0,30);
const $=id=>document.getElementById(id);
function show(id){const d=id==='result';document.body.classList.toggle('dark',d);document.documentElement.classList.toggle('dark',d);document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));$(id).classList.add('on');window.scrollTo(0,0)}
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function begin(m){mode=m;qs=m==='quick'?Q.slice(0,8):Q;i=0;answers=[];shuffled=qs.map(()=>shuffle(ORDER));show('quiz');renderQ()}
function renderQ(){
  const [scene,opts]=qs[i];
  $('count').textContent=`${mode==='quick'?'かんたん診断':'くわしい診断'}　${i+1} ／ ${qs.length}`;
  $('bar').style.width=(i/qs.length*100)+'%';
  $('scene').textContent=scene;
  $('opts').innerHTML='';
  shuffled[i].forEach(k=>{
    const b=document.createElement('button');b.className='opt';b.textContent=opts[k];
    if(answers[i]===k)b.classList.add('picked');
    b.onclick=()=>{b.classList.add('picked');answers[i]=k;setTimeout(next,220)};
    $('opts').appendChild(b);
  });
  $('backBtn').style.visibility=i===0?'hidden':'visible';
}
function next(){if(i<qs.length-1){i++;renderQ()}else finish()}
function back(){if(i>0){i--;renderQ()}}
function lastPick(cands){for(let k=answers.length-1;k>=0;k--){if(cands.includes(answers[k]))return answers[k]}return cands[0]}
function finish(){
  const s={};ORDER.forEach(k=>s[k]=0);answers.forEach(k=>s[k]++);
  const max=Math.max(...Object.values(s));
  const main=lastPick(ORDER.filter(k=>s[k]===max));
  let sub="";
  if(mode==='deep'){
    const rest=ORDER.filter(k=>k!==main);const m2=Math.max(...rest.map(k=>s[k]));
    if(m2>0)sub=lastPick(rest.filter(k=>s[k]===m2));
  }
  res={main,sub,scores:s};
  log();renderResult(main,sub);
}
function renderResult(main,sub){
  const t=TYPES[main];
  $('rname').textContent=t.name;$('rread').textContent=t.read?t.read:'';$('ricon').innerHTML=ICON[main];$('whyTitle').textContent=`なぜ「${t.name}」なのか`;$('rwhy').textContent=t.why;
  $('rsub').innerHTML=mode==='deep'&&res&&res.main===main?(sub?`こころの影：<b>${TYPES[sub].name}</b>`:`こころの影：<b>なし（まっすぐ型）</b>`):'';
  $('rcatch').innerHTML=t.catch;
  const showCombo=mode==='deep'&&res&&res.main===main;
  $('comboCard').style.display=showCombo?'block':'none';
  if(showCombo){$('comboTitle').textContent=sub?`${t.name} × ${TYPES[sub].name}のあなた`:`まっすぐな${t.name}のあなた`;$('comboText').textContent=COMBO[main+'_'+sub]}
  $('rtraits').innerHTML=t.traits.map(x=>`<li>${x}</li>`).join('');
  $('rkuse').textContent=t.kuse;$('rhonne').textContent=t.honne;$('rhito').innerHTML=t.hito;
  const comboUrl=showCombo?COMBO_URLS[main+'_'+sub]:"";
  const url=comboUrl||LETTER_URLS[main]||NOTE_TOP_URL;
  const btn=$('letterBtn');
  if(url){btn.href=url;btn.textContent=comboUrl?`${t.name}×${sub?TYPES[sub].name:'まっすぐ'}のあなたへの手紙を読む`:`${t.name}のあなたに宛てた手紙を読む`;btn.style.opacity=1;btn.style.pointerEvents='auto';$('letterNote').textContent='noteで、このタイプのあなただけに宛てた手紙を書いています。'}
  else{btn.removeAttribute('href');btn.textContent=`${t.name}のあなたへの手紙は、準備中です`;btn.style.opacity=.55;btn.style.pointerEvents='none';$('letterNote').textContent='noteで「こころにひとこと」と検索すると、届いたときに読めます。'}
  $('deepBtn').style.display=mode==='quick'&&res&&res.main===main?'block':'none';
  $('types').innerHTML=ORDER.map(x=>`<button onclick="renderResult('${x}','')"><b>${TYPES[x].name}</b><br>${TYPES[x].catch.replace('<br>','')}</button>`).join('');
  $('types').style.display='none';
  show('result');
}
function log(){
  if(!LOG_URL)return;
  const data={mode,main:res.main,sub:res.sub,from:FROM,answers:answers.join(','),scores:ORDER.map(k=>res.scores[k]).join(',')};
  try{fetch(LOG_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)}).catch(()=>{})}catch(e){}
}
function toggleTypes(){const el=$('types');el.style.display=el.style.display==='none'?'grid':'none'}
function restart(){res=null;show('start')}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}
function copyShare(){
  if(!res)return;const t=TYPES[res.main];
  const s=res.sub?`（こころの影：${TYPES[res.sub].name}）`:'';
  const txt=`私のこころは「${t.name}」${s}でした。\n${t.catch.replace('<br>','')}\n#こころにひとこと #こころのタイプ診断`;
  try{navigator.clipboard.writeText(txt).then(()=>toast('コピーしました'),()=>toast('コピーできませんでした'))}catch(e){toast('コピーできませんでした')}
}
